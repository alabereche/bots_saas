<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>AuraBot — غرفة العمليات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/ayrexjs.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%2310b981' stroke-width='1.8' stroke-dasharray='2.5 2.5'/%3E%3Cpath d='M12 4.5L14.2 9.8L19.5 12L14.2 14.2L12 19.5L9.8 14.2L4.5 12L9.8 9.8L12 4.5Z' fill='%2310b981'/%3E%3C/svg%3E" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>

  <!-- ═══ Login (Google only) ═══ -->
  <div id="login-view" class="login-view">
    <div class="login-card">
      <div class="brand-mark">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <path d="M12 4.5L14.2 9.8L19.5 12L14.2 14.2L12 19.5L9.8 14.2L4.5 12L9.8 9.8L12 4.5Z" fill="currentColor"/>
        </svg>
      </div>
      <h1>AuraBot <span>Admin</span></h1>
      <p>غرفة عمليات المنصة — الدخول بحساب Google المصرح له فقط</p>
      <button type="button" class="google-btn" id="google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.382-3.917z"/><path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.382-3.917z"/></svg>
        <span>المتابعة بحساب Google</span>
      </button>
      <p class="login-error" id="login-error"></p>
      <p class="login-note">حساب واحد مصرح له فقط — أي حساب آخر سيُرفض على الخادم</p>
    </div>
  </div>

  <!-- ═══ App ═══ -->
  <div id="app-view" class="app-view hidden">
    <header class="admin-header">
      <div class="admin-brand">
        <div class="mini-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 4.5L14.2 9.8L19.5 12L14.2 14.2L12 19.5L9.8 14.2L4.5 12L9.8 9.8L12 4.5Z" fill="currentColor"/></svg>
        </div>
        <div>
          <b>Aura<span>Bot</span> — Admin</b>
          <small id="admin-email">غرفة العمليات</small>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="refresh-btn" title="تحديث الآن">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button class="icon-btn" id="logout-btn" title="خروج">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <main class="admin-main">
      <section class="kpi-grid" id="kpis"></section>

      <section class="engine-card" id="engine-card"></section>

      <section>
        <div class="section-head">
          <h2>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            التجار — رادار المبيعات
          </h2>
          <div class="merchant-search">
            <input id="merchant-search" type="text" placeholder="بحث بالاسم أو البريد..." />
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </div>
        </div>
        <div class="merchants-grid" id="merchants"></div>
      </section>
    </main>

    <footer class="admin-footer">
      آخر تحديث: <span id="updated-at">—</span> · تحديث تلقائي كل 30 ثانية
    </footer>
  </div>

<script>
'use strict';

// ─── Firebase (same project as the platform) ───
firebase.initializeApp({
  apiKey: 'AIzaSyAB6AS2qy2e9iAgG4RMIERDmLXCvs2WQEU',
  authDomain: 'bots-saas-c7190.firebaseapp.com',
  projectId: 'bots-saas-c7190',
});
const fauth = firebase.auth();
const provider = new firebase.auth.GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

let idToken = '';
let adminEmail = '';
let overviewCache = null;
let refreshTimer = null;

const $ = (id) => document.getElementById(id);

const ICONS = {
  merchants: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  bot: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5L14.2 9.8L19.5 12L14.2 14.2L12 19.5L9.8 14.2L4.5 12L9.8 9.8L12 4.5Z"/></svg>',
  orders: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>',
  leads: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"/></svg>',
  clock: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
  chip: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/></svg>',
  memory: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 19v-3M10 19v-3M14 19v-3M18 19v-3M8 11V9M16 11V9M12 11V9M2 15h20"/><rect x="4" y="3" width="16" height="10" rx="2"/></svg>',
  calendar: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  users: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
};

const STATE_LABELS = {
  active: { label: 'نشط ويبيع', cls: 'state-chip--active' },
  idle: { label: 'مربوط وخامل', cls: 'state-chip--idle' },
  stalled: { label: 'توقف قبل الربط', cls: 'state-chip--stalled' },
};

function showLoginError(msg) {
  $('login-error').textContent = msg;
  $('login-view').classList.remove('hidden');
  $('app-view').classList.add('hidden');
}

function logout() {
  fauth.signOut().catch(() => {});
  idToken = '';
  adminEmail = '';
  overviewCache = null;
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  showLoginError('');
}

async function loadOverview() {
  $('refresh-btn').classList.add('spin');
  try {
    const res = await fetch('https://wa.nosfir.online/api/ayrexjs/overview', { headers: { Authorization: `Bearer ${idToken}` } });
    if (res.status === 401 || res.status === 403) {
      logout();
      showLoginError('هذا الحساب غير مصرح له — الدخول لحساب الأدمن فقط');
      return;
    }
    if (!res.ok) throw new Error('تعذر جلب البيانات');
    overviewCache = await res.json();
    render(overviewCache);
  } catch (e) {
    if (!overviewCache) showLoginError(e.message || 'تعذر الاتصال بالمحرك');
  } finally {
    $('refresh-btn').classList.remove('spin');
  }
}

function startApp() {
  $('login-view').classList.add('hidden');
  loadOverview();
  if (!refreshTimer) refreshTimer = setInterval(() => { if (idToken) loadOverview(); }, 30000);
}

// ─── Auth state: session restore + post-redirect return ───
fauth.onAuthStateChanged(async (user) => {
  if (!user) return;
  idToken = await user.getIdToken();
  adminEmail = user.email || '';
  $('admin-email').textContent = adminEmail;
  startApp();
});
fauth.getRedirectResult().catch(() => {});

// ─── Google sign-in (redirect-first: robust with strict cookie settings) ───
$('google-btn').addEventListener('click', async () => {
  $('login-error').textContent = 'جاري التحويل إلى Google...';
  try {
    await fauth.signInWithRedirect(provider);
  } catch (e) {
    showLoginError('تعذر بدء الدخول (' + (e.code || e.message) + ')');
  }
});
fauth.getRedirectResult().catch((e) => {
  showLoginError('تعذر إكمال الدخول (' + (e.code || e.message) + ')');
});

// ─── Rendering ───
function render(data) {
  $('app-view').classList.remove('hidden');
  const t = data.totals;
  $('kpis').innerHTML = `
    <div class="kpi kpi--emerald"><div class="kpi-icon">${ICONS.merchants}</div><div><b>${t.merchants}</b><span>تجار مسجلون</span></div></div>
    <div class="kpi kpi--cyan"><div class="kpi-icon">${ICONS.bot}</div><div><b>${t.connectedBots}<i style="font-size:0.8rem;color:var(--text-3)">/${t.bots}</i></b><span>بوتات متصلة</span></div></div>
    <div class="kpi kpi--violet"><div class="kpi-icon">${ICONS.orders}</div><div><b>${t.orders}</b><span>طلبيات</span></div></div>
    <div class="kpi kpi--red"><div class="kpi-icon">${ICONS.leads}</div><div><b>${t.hotLeads}<i style="font-size:0.8rem;color:var(--text-3)">/${t.leads}</i></b><span>عملاء ساخنون</span></div></div>
  `;

  const en = data.engine;
  const upH = Math.floor(en.uptime / 3600);
  const upM = Math.floor((en.uptime % 3600) / 60);
  $('engine-card').innerHTML = `
    <h2><span class="live-dot"></span> صحة المحرك — يعمل الآن</h2>
    <div class="engine-metric">${ICONS.clock}<span>مدة التشغيل</span><b>${upH}س ${upM}د</b></div>
    <div class="engine-metric">${ICONS.memory}<span>الذاكرة</span><b>${en.memoryMB}MB</b></div>
    <div class="engine-metric">${ICONS.chip}<span>جلسات واتساب حية</span><b>${en.sessions}</b></div>
  `;

  renderMerchants(data.merchants);
  $('updated-at').textContent = new Date().toLocaleTimeString('ar-DZ');
}

function renderMerchants(merchants) {
  const q = ($('merchant-search').value || '').toLowerCase().trim();
  const list = merchants.filter(m =>
    !q || (m.name || '').toLowerCase().includes(q) || (m.email || '').toLowerCase().includes(q)
  );

  if (list.length === 0) {
    $('merchants').innerHTML = `
      <div class="state-box" style="grid-column: 1 / -1;">
        ${ICONS.users}
        <p>${q ? 'لا توجد نتائج مطابقة لبحثك' : 'لا يوجد تجار مسجلون بعد'}</p>
      </div>`;
    return;
  }

  $('merchants').innerHTML = list.map(m => {
    const st = STATE_LABELS[m.state] || STATE_LABELS.stalled;
    const firstChar = (m.name || m.email || '?').trim().charAt(0).toUpperCase();
    const joined = m.joinedAt ? new Date(m.joinedAt).toLocaleDateString('ar-DZ') : '—';
    const botChips = m.bots.length === 0
      ? '<span class="bot-chip">لم ينشئ بوتاً بعد</span>'
      : m.bots.map(b => `
          <span class="bot-chip">
            <i class="${b.wa === 'connected' ? 'wa-on' : 'wa-off'}" title="واتساب"></i> واتساب
          </span>
          ${b.tg ? '<span class="bot-chip"><i class="tg-on" title="تيليغرام"></i> تيليغرام</span>' : ''}
        `).join('');
    return `
      <div class="merchant-card">
        <div class="mc-head">
          <div class="mc-id">
            <div class="mc-avatar">${firstChar}</div>
            <div style="min-width:0">
              <div class="mc-name">${m.name || 'تاجر'}</div>
              <div class="mc-email">${m.email}</div>
            </div>
          </div>
          <span class="state-chip ${st.cls}"><i></i>${st.label}</span>
        </div>
        <div class="mc-stats">
          <div class="mc-stat"><b>${m.bots.length}</b><span>بوتات</span></div>
          <div class="mc-stat mc-stat--emerald"><b>${m.orders}</b><span>طلبيات</span></div>
          <div class="mc-stat"><b>${m.leads}</b><span>عملاء</span></div>
          <div class="mc-stat mc-stat--emerald"><b>${m.hotLeads}</b><span>ساخنون</span></div>
        </div>
        <div class="mc-bots">${botChips}</div>
        <div class="mc-footer">
          <span class="mc-joined">${ICONS.calendar}<span>انضم: ${joined}</span></span>
        </div>
      </div>`;
  }).join('');
}

// ─── Wiring ───
$('refresh-btn').addEventListener('click', () => { if (idToken) loadOverview(); });
$('logout-btn').addEventListener('click', logout);
$('merchant-search').addEventListener('input', () => {
  if (overviewCache) renderMerchants(overviewCache.merchants);
});
</script>
</body>
</html>
